name: Tests and publication checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Scan published files and history
        run: python tools/security_check.py --history
      - name: Test workspace safety
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Run the original offline regression suites
        run: python tools/check.py
      - name: Replay the historical demonstration
        run: python tools/demo.py
      - name: Check the checkout stayed unchanged
        run: git diff --exit-code
